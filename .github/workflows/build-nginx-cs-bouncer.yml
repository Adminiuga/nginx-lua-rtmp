name: Build Nginx Docker Image with CrowdSec Bouncer Lua Module

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      base_image:
        description: 'Base image to use for build'
        required: false
        default: 'ghcr.io/adminiuga/nginx-lua-rtmp:latest'
  
  # Reusable workflow trigger
  workflow_call:
    inputs:
      base_image:
        description: 'Base image to use for build'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ vars.BOUNCER_IMAGE_NAME || 'nginx-cs-bouncer' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.build.outputs.digest }}
      image_tags: ${{ steps.meta.outputs.tags }}
      image_metadata: ${{ steps.build.outputs.metadata }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Repository owner lowercase
        id: lower
        run: |
          echo "repository_owner=$(echo $GITHUB_REPOSITORY_OWNER | tr [:upper:] [:lower:])" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME_PREFIX=$(echo $GITHUB_REPOSITORY | tr [:upper:] [:lower:])" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get nginx version
        id: nginx-version
        run: |
          # Pull the base image to get its digest
          docker pull ${{ inputs.base_image }}
          NGINX_VERSION=$(docker run --rm ${{ inputs.base_image }} nginx -v 2>&1 | grep -oP 'nginx/\K[0-9.]+')
          echo "version=$NGINX_VERSION" >> $GITHUB_OUTPUT
          echo "NGINX version: $NGINX_VERSION"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lower.outputs.image_name_prefix }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,enable={{is_default_branch}}
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.nginx-version.outputs.version }},enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./cs-nginx-bouncer
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NGINX_FROM_IMAGE=${{ inputs.base_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64