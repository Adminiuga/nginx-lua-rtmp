name: Build Nginx Docker Image with Modules

on:
  # Manual trigger
  workflow_dispatch:
  
  # Trigger when Dockerfile is updated
  push:
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-nginx-image.yml'
    branches:
      - main
      - master
  
  # Trigger on pull requests that modify Dockerfile
  pull_request:
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-nginx-image.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nginx-lua-rtmp
  NGINX_BASE_IMAGE: nginx:stable

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Repository owner lowercase
        id: lower
        run: |
          echo "repository_owner=$(echo $GITHUB_REPOSITORY_OWNER | tr [:upper:] [:lower:])" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get nginx module docker file
        id: nginx-dockerfile
        run: |
          curl -o Dockerfile https://raw.githubusercontent.com/nginx/docker-nginx/refs/heads/master/modules/Dockerfile

      - name: Get NGINX version
        id: nginx-version
        run: |
          NGINX_VERSION=$(docker run --rm ${{ env.NGINX_BASE_IMAGE }} nginx -v 2>&1 | grep -oP 'nginx/\K[0-9.]+')
          echo "NGINX_VERSION=$NGINX_VERSION" >> $GITHUB_ENV
          echo "Detected NGINX version: $NGINX_VERSION"    

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.nginx-version.outputs.NGINX_VERSION }},enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ENABLED_MODULES=ndk lua rtmp
            NGINX_FROM_IMAGE=${{ env.NGINX_BASE_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
      
      - name: Output image details
        run: |
          echo "Image built and pushed successfully!"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"
